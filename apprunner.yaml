version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm install --omit=dev
run:
  runtime-version: 22
  command: node server.js
  network:
    port: 3000
    env: PORT
  env:
    - name: HOST
      value: 0.0.0.0
    - name: MAX_ARENA_PLAYERS
      value: "20"
    - name: MAX_ARENA_SHARDS
      value: "100"
